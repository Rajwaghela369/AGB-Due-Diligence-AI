[project]
name = "agb-check"
version = "0.1.0"
description = "Agentic AGB review for German legal due diligence"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.4",
    "langgraph-checkpoint-postgres>=2",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "spacy>=3.8.18",
]

[project.optional-dependencies]
pipelines = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "lxml>=5.3",
    "qdrant-client>=1.12",
    "prefect>=3.1",
    "psycopg[binary]>=3.2",
    "langfuse>=2.53",
]
local-embeddings = [
    # Only needed to A/B bge-m3 against the hosted embedding model in Phase 1.
    "sentence-transformers>=3.3",
]
app = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "anthropic>=0.40",
    "google-genai>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langfuse>=2.53",
    "qdrant-client>=1.12",
    "psycopg[binary]>=3.2",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.34",
    "ag-ui-protocol>=1.0.0",
]
evals = [
    "anthropic>=0.40",
    "google-genai>=3.2",
    "langfuse>=2.53",
    "scikit-learn>=1.5",
]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "import-linter>=2.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core", "pipelines", "app", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
]
