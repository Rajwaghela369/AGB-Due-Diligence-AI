name: evals

# The Phase 3 gate asks for a CI job that reruns the suite whenever a prompt or
# the agent changes. Path-filtered rather than run on every push, because each
# run spends quota and most commits cannot affect a verdict.
on:
  push:
    paths:
      - "evals/**"
      - "app/**"
      - "packages/core/llm.py"
      - "packages/core/retrieval.py"
      - "configs/evals.yaml"
      - "configs/app.yaml"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "evals/**"
      - "app/**"
      - "packages/core/llm.py"
      - "packages/core/retrieval.py"
      - "configs/evals.yaml"
      - "configs/app.yaml"
      - ".github/workflows/evals.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras

      # Scorers, slicing and parsing are pure, so they are checked with no keys
      # and no spend. This part must pass on a fork PR too.
      - name: Harness unit tests
        run: >
          uv run pytest -q tests/test_scorers.py tests/test_baseline.py
          tests/test_datasets.py tests/test_harness.py tests/test_run_baseline.py
          tests/test_run_agent.py

      # A fork PR has no secrets. Skipping loudly beats failing on something
      # the contributor cannot fix.
      - name: Check for credentials
        id: creds
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ] && [ -n "${{ secrets.LANGFUSE_SECRET_KEY }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No eval credentials in this context; the live smoke runs were skipped."
          fi

      # 5 clauses, not the whole slice: enough to catch a broken prompt, a
      # changed response format or a harness regression. The numbers that count
      # come from `make baseline` and `make eval`, run deliberately, not here.
      - name: Baseline smoke run
        if: steps.creds.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: uv run python -m evals.run_baseline --split dev --slice first:5

      # The agent additionally needs the vector store, the embedding API and
      # Postgres, since it retrieves and persists verdicts.
      - name: Agent smoke run
        if: steps.creds.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: uv run python -m evals.run_agent --split dev --slice first:5

      - name: Fail on widespread task failures
        if: steps.creds.outputs.available == 'true'
        run: |
          uv run python - <<'PY'
          import json, sys
          from pathlib import Path

          worst = 0.0
          for path in (Path("reports/p3_baseline_dev5.json"), Path("reports/p4_agent_dev5.json")):
              if not path.exists():
                  sys.exit(f"{path} is missing; the smoke run did not finish")
              report = json.loads(path.read_text())
              failures, items = len(report["failures"]), report["metrics"]["items"]
              rate = failures / items if items else 1.0
              print(f"{path.name}: {failures}/{int(items)} items without a verdict ({rate:.1%})")
              worst = max(worst, rate)
          # Not a quality gate - this catches a prompt or schema change that
          # stops the model answering at all.
          if worst > 0.1:
              sys.exit(f"task failure rate {worst:.1%} exceeds 10%")
          PY

      - name: Upload the run reports
        if: steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            reports/p3_baseline_dev5.json
            reports/p4_agent_dev5.json
