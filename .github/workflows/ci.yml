name: ci

# Disabled for now: manual runs only, from the Actions tab. To re-enable,
# restore the push and pull_request triggers below.
on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: make check

# Live evals run in .github/workflows/evals.yml, path-filtered to changes that can
# actually affect a verdict. `make check` here covers the harness's pure logic -
# scorers, prompt rendering and answer parsing - on every push, with no spend.
