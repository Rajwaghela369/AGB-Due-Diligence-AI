name: ci

# Disabled for now: manual runs only, from the Actions tab. To re-enable,
# restore the push and pull_request triggers below.
on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # `make check` runs the web checks and the Playwright end-to-end test, so it needs
      # Node, pnpm (the version pinned in web/package.json) and Chromium.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: make check

# Live evals run in .github/workflows/evals.yml, path-filtered to changes that can
# actually affect a verdict. `make check` here covers the harness's pure logic -
# scorers, prompt rendering and answer parsing - on every push, with no spend.
