# Runtime configuration for the agent. Not part of the index lineage.

models:
  # Two slots on purpose: routing is cheap classification, judging needs reasoning.
  router:
    provider: openai
    name: gpt-4o-mini
    temperature: 0
  judge:
    provider: openai
    name: gpt-4o
    temperature: 0

agent:
  max_retrieval_retries: 1
  confidence_uncertain_below: 0.6

store:
  # The app reads the ALIAS, never a versioned collection directly.
  # The manifest behind it is asserted at startup.
  backend: qdrant
  alias: bgb_agb

database:
  path: stores/app.db

langfuse:
  enabled: true
