# Runtime configuration for the agent. Not part of the index lineage.

models:
  router:
    provider: jina
    name: jina-embeddings-v3
  # The judge runs on the Decisions API: typed questions, calibrated
  # probabilities, zero output tokens. Model id verified from
  # aistudio.google.com/docs/decisions-api.
  judge:
    provider: gemini
    name: gemini-decision-1
  # The Decisions API cannot generate text, so the German reasoning needs one
  # short generating call - and only on potentially_void verdicts, which is
  # ~30% of clauses. Without it there is no error analysis.
  explain:
    provider: gemini
    # Confirmed available by the Gemini API on this project's key.
    name: gemini-3.8-flash
    max_output_tokens: 300

prompts:
  # Evaluation runs use a labelled Langfuse version. Promote a version to
  # `production` once an evaluation run shows it is worth keeping.
  label: evaluation

retrieval:
  # No-router retrieval measured primary@5 0.258, below the current 0.355.
  # Keep the cheap Jina router (models.router) and force AGB-control
  # paragraphs into every set.
  top_k: 10
  always_include_topics: [general]
  always_include_paragraphs: [305, 305a, 305b, 305c, 306, 306a, 307, 308, 309, 310]
  # How many hits to read before cutting to top_k; deep enough to see where a
  # miss actually ranked.
  search_depth: 20

agent:
  # A noul answer is the calibrated probability that the statement holds, and
  # the API clamps it to 0.01-0.99 - so no threshold at or above 0.99 can ever
  # fire.
  void_threshold: 0.5
  basis_threshold: 0.5
  # Confidence comes from the API rather than a model self-reporting a number,
  # which is what makes this threshold meaningful.
  confidence_uncertain_below: 0.6
  max_retrieval_retries: 1
  explain_enabled: true

store:
  # The app reads the ALIAS, never a versioned collection directly.
  # The manifest behind it is asserted on first use.
  backend: qdrant
  alias: bgb_agb

langfuse:
  enabled: true

review:
  # Clauses of one review judged at once. Each judge call reserves from the one
  # shared limiter below, so this bounds threads, not provider requests.
  max_concurrency: 4
  # One limiter for the whole server (core.budget.SharedLimiter). Unset means no
  # limit; a clause that hits either waits, it does not fail. Set both to the
  # project's Gemini quota before the live gate.
  rpm: null
  daily_budget: null
  # For `cost_usd`; 0 until the Gemini prices are confirmed for this project.
  price_usd_per_million_tokens:
    input: 0
    output: 0
