# P1 KB-INGEST configuration.
# This file is part of the index's lineage: it is hashed into the store manifest,
# so any change here means the index must be rebuilt.

source:
  provider: open_legal_data
  dataset: openlegaldata/laws-germany
  config: dump-20260520            # the dump to read; -1k and -10k variants exist for sampling
  revision: ad694182262416ad204f43d0c13ca0a7dd12057e

embedding:
  provider: openai                 # openai | local
  model: text-embedding-3-large
  dimension: 3072                  # 3-large supports shortening via `dimensions`
  normalize: true
  batch_size: 64

store:
  backend: qdrant                  # Qdrant Cloud; URL and key come from the environment
  collection: bgb_agb_v1
  alias: bgb_agb                   # what the app reads; flipped only after the gate passes
  distance: Cosine
  # Qdrant point IDs must be int or UUID, so chunk_id is hashed to a
  # deterministic UUID5 and kept verbatim in the payload.
  id_strategy: uuid5_of_chunk_id
  payload_indexes: [topics, paragraph, kind]

chunking:
  # Per-paragraph level is set in kb_paragraphs.yaml; this is the fallback.
  default_level: absatz            # absatz | item
  # Item chunks are grammatical fragments of the paragraph's stem sentence,
  # so the stem is carried into both embed_text and text.
  include_stem_sentence: true
  embed_text_template: "{law} {paragraph} {title}{stem}{item_label}: {text}"

retrieval:
  top_k: 5
  # Chunks tagged "general" are always in the candidate set, whatever the router says.
  always_include_topics: ["general"]
