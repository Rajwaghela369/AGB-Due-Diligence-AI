# The API and the Gotenberg service it calls for DOCX conversion. Run with `make api-up`.
# Secrets come from .env (copy .env.example); nothing secret is written in this file.

services:
  api:
    build: .
    image: agb-check-api
    env_file: .env
    environment:
      GOTENBERG_URL: http://gotenberg:3000
    ports:
      # Loopback only: the browser reaches the API through the Vite dev proxy or a reverse proxy.
      - "127.0.0.1:8000:8000"
    volumes:
      # Immutable source PDFs survive container rebuilds.
      - files:/app/stores/files
    depends_on:
      - gotenberg
      - minio
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gotenberg:
    # The LibreOffice-only variant: DOCX conversion is all this service is used for, and
    # the image without Chromium is smaller and starts no browser.
    image: gotenberg/gotenberg:8-libreoffice
    # Reachable inside the compose network as http://gotenberg:3000. The loopback mapping
    # lets `make api` on the host use the same service; nothing else can reach it.
    ports:
      - "127.0.0.1:3000:3000"
    # No healthcheck: the image's curl is unverified, and the API's own readiness covers the
    # conversion path (DOCX uploads fail with conversion_failed until Gotenberg answers).
    restart: unless-stopped

  minio:
    # S3-compatible development storage. Production uses the same API at an EU provider.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    # Creates the development bucket once; `--ignore-existing` makes restarts harmless.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing local/agb-check-files"

  keycloak:
    # Development login (9.E, decision #2). Only with `docker compose --profile auth up
    # keycloak`; the API checks tokens against it once `auth.enabled: true`. Production
    # points `auth.oidc.issuer` at the firm's provider instead. Dev mode: no TLS, an
    # in-memory database, and the realm (test client and users) imported on every start.
    image: quay.io/keycloak/keycloak:26.4.2
    profiles: ["auth"]
    command: start-dev --import-realm --http-port 8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./configs/keycloak:/opt/keycloak/data/import:ro

volumes:
  files:
  minio:
